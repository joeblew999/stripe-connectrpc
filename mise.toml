[settings]
# rust-toolchain.toml is the Rust pin; this makes `mise install` honour it.
idiomatic_version_file_enable_tools = ["rust"]

[tools]
"aqua:jdx/pitchfork" = "latest"
"aqua:nushell/nushell" = "0.112.2"
"aqua:stripe/stripe-cli" = "1.42.1"

# Runtime stack — cablehead's tools, installed from GitHub releases:
#   xs       = event store (single daemon, append-only stream)
#   http-nu  = HTTP server dispatching to nushell handlers
# pitchfork supervises both as daemons (see pitchfork.toml).
"github:cablehead/xs" = "0.12.0"
"github:cablehead/http-nu" = "0.16.0"

# --- alternative-runtime tools (cf:* tasks only) ---
# Lets you also deploy the stripe-connectrpc service to Cloudflare Workers.
# Not used by the primary http-nu+xs runtime; safe to remove if you'll
# never run cf:*. Pinned because wrangler breaks on minor bumps.
"npm:wrangler" = "4.71.0"

# --- ConnectRPC codegen for the alt-runtime Rust worker (cf:* tasks) ---
# protoc compiles proto/stripe/v1/*.proto via connectrpc-build (Rust server+client);
# buf does proto lint + TypeScript client codegen for consuming projects.
# Same pins as google_maps feat/cloudflare-workers.
"aqua:protocolbuffers/protobuf/protoc" = "latest"
"aqua:bufbuild/buf" = "latest"

# --- opensigma read/analytics side (sigma:* tasks only) ---
# opensigma (OSS Stripe Sigma / Data Pipeline replacement) is vendored into
# .src/opensigma via `mise run sigma:src` and runs with its OWN pnpm-local
# toolchain (including its own wrangler@^4.95). We only need node + pnpm here.
# node 22 because opensigma's wrangler needs >=22 (its .nvmrc wrongly says 20).
# Safe to remove if you'll never run sigma:*.
node = "22"
"npm:pnpm" = "latest"

[env]
XS_STORE      = "{{ config_root }}/.xs-store"
HTTP_NU_ADDR  = "127.0.0.1:8787"
WASM_TARGET   = "wasm32-unknown-unknown"
SIGMA_REPO    = "https://github.com/choyiny/opensigma"
SIGMA_SRC     = "{{ config_root }}/.src/opensigma"

# =============================================================================
# Naming convention: every task is `<noun>:<verb>` so paired operations
# (e.g. stripe:bootstrap ↔ stripe:teardown, daemons:up ↔ daemons:down) read
# obviously together in `mise tasks`. The eight noun groups:
#
#   tools:*     — toolchain + secrets
#   daemons:*   — pitchfork runtime supervision
#   stripe:*    — Stripe-side state (push/pull/inspect)
#   data:*      — local JSONL inspection
#   test:*      — sandbox HIL flows
#   xs:*        — event store ops
#   dispatch:*  — outbound consumer fan-out (Phase 3 audit)
#   rpc:*       — inbound consumer-RPC (POST /v1/checkout audit)
#   open:*      — idempotent browser launchers
#   cf:*        — alternative runtime (Cloudflare Workers; alt-runtime/)
#   sigma:*     — opensigma read/analytics side (vendored in .src/opensigma)
# =============================================================================

# =============================================================================
# tools:* — toolchain installation + secret onboarding + sanity checks
# =============================================================================

[tasks."tools:install"]
description = "Install all CLI tools declared in [tools]"
run = "mise install"

[tasks."tools:onboard"]
description = "Interactive: collect Stripe creds, store in macOS keychain via fnox"
run = "nu scripts/onboard.nu"

[tasks."tools:verify"]
description = "Check toolchain + keychain entries"
run = "nu scripts/verify.nu"

[tasks."tools:verify-all"]
description = "Run every non-interactive mise task and report PASS/FAIL/SKIP"
run = "nu scripts/verify.nu --all"

# =============================================================================
# daemons:* — pitchfork supervises 4 runtime daemons (config: pitchfork.toml)
#   http             = http-nu+xs (HTTP server + embedded event store)
#   listen           = stripe-cli forwarding Stripe → localhost:8787/v1/webhook
#   dispatcher       = tails xs verified events, POSTs to consumer webhooks
#   dispatch-retry   = re-attempts due retries on Stripe-style backoff
# =============================================================================

[tasks."daemons:up"]
description = "Start all 4 daemons (silent; use daemons:logs to tail)"
run = "pitchfork start -l"

[tasks."daemons:down"]
description = "Stop all 4 daemons"
run = "pitchfork stop http listen dispatcher dispatch-retry"

[tasks."daemons:status"]
description = "Show pitchfork daemon status"
run = "pitchfork list"

[tasks."daemons:logs"]
description = "Tail logs from all 4 daemons"
run = "pitchfork logs http listen dispatcher dispatch-retry"

[tasks."daemons:tui"]
description = "Interactive pitchfork dashboard"
run = "pitchfork tui"

[tasks."daemons:restart-http"]
description = "Restart http-nu (after handler.nu / routes/*.nu edits)"
run = "pitchfork stop http ; pitchfork start http"

[tasks."daemons:restart-listen"]
description = "Restart stripe-listen (after a new whsec_)"
run = "pitchfork stop listen ; pitchfork start listen"

[tasks."daemons:restart-dispatcher"]
description = "Restart dispatcher (after dispatcher.nu / lib.nu / project consumer-block edits)"
run = "pitchfork stop dispatcher ; pitchfork start dispatcher"

[tasks."daemons:restart-dispatch-retry"]
description = "Restart dispatch-retry (after dispatch-retry.nu / lib.nu edits)"
run = "pitchfork stop dispatch-retry ; pitchfork start dispatch-retry"

# =============================================================================
# stripe:* — Stripe-side state (push/pull/inspect)
#   stripe:bootstrap    push EVERY data/ JSONL into your Stripe account
#   stripe:teardown     archive EVERY project's products + prices
# =============================================================================

[tasks."stripe:bootstrap"]
description = "Push data/ to Stripe: products + prices + portal + payment-methods + webhook (idempotent)"
run = 'fnox exec -- nu scripts/bootstrap.nu apply all'

[tasks."stripe:teardown"]
description = "Archive every project's products + prices on Stripe (reverse of stripe:bootstrap)"
run = 'fnox exec -- nu scripts/bootstrap.nu teardown all'

[tasks."stripe:verify-state"]
description = "Confirm Stripe-side state matches every data/projects/*/JSONL declaration"
run = 'fnox exec -- nu scripts/bootstrap.nu verify-state'

[tasks."stripe:apply-products"]
description = "Upsert products to Stripe from data/projects/*/products.jsonl"
run = 'fnox exec -- nu scripts/bootstrap.nu apply products'

[tasks."stripe:apply-prices"]
description = "Upsert prices to Stripe from data/projects/*/prices.jsonl"
run = 'fnox exec -- nu scripts/bootstrap.nu apply prices'

[tasks."stripe:apply-portal"]
description = "Configure Stripe Customer Portal from data/config/portal-config.jsonl"
run = 'fnox exec -- nu scripts/bootstrap.nu apply portal'

[tasks."stripe:apply-payment-methods"]
description = "Reconcile Stripe payment_method_configuration from data/config/payment-methods.jsonl"
run = 'fnox exec -- nu scripts/bootstrap.nu apply payment-methods'

[tasks."stripe:apply-webhook"]
description = "Register a Stripe webhook endpoint at STRIPE_SERVICE_URL (warn-skipped if unset)"
run = 'fnox exec -- nu scripts/bootstrap.nu apply webhook'

[tasks."stripe:teardown-project"]
description = "Archive ONE project's products + prices — usage: mise run stripe:teardown-project -- <slug>"
usage = '''
arg "<slug>" help="project slug (must match data/projects/<slug>/)"
'''
run = 'fnox exec -- nu scripts/bootstrap.nu teardown ${usage_slug}'

[tasks."stripe:account"]
description = "Stripe account snapshot (mode/country/capabilities)"
run = 'fnox exec -- nu scripts/bootstrap.nu show account'

[tasks."stripe:status"]
description = "Stripe-side snapshot: webhooks + products + prices + portal"
run = 'fnox exec -- nu scripts/bootstrap.nu show status'

[tasks."stripe:payment-methods"]
description = "Read live state of the account's default payment_method_configuration"
run = 'fnox exec -- nu scripts/bootstrap.nu show payment-methods'

[tasks."stripe:login"]
description = "Pair stripe-cli with your Stripe account (browser)"
run = "stripe login"

[tasks."stripe:listen"]
description = "Forward Stripe webhooks to local http-nu (used by pitchfork's 'listen' daemon)"
run = "fnox exec -- stripe listen --forward-to http://localhost:8787/v1/webhook"

[tasks."stripe:trigger-completed"]
description = "Trigger a synthetic checkout.session.completed event for testing"
run = "fnox exec -- stripe trigger checkout.session.completed"

# =============================================================================
# data:* — local JSONL inspection (no Stripe round-trip)
# =============================================================================

[tasks."data:scan"]
description = "Summary of every JSONL under data/ (row counts + groupings)"
run = 'nu scripts/bootstrap.nu show scan'

[tasks."data:projects"]
description = "Registered consumer projects (data/projects/*/project.json)"
run = 'nu scripts/bootstrap.nu show projects'

[tasks."data:countries"]
description = "60 jurisdictions grouped by region (seller modes + buyer blocks)"
run = 'nu scripts/bootstrap.nu show countries'

[tasks."data:country"]
description = "One country's mode availability — usage: mise run data:country -- AU"
usage = '''
arg "<iso>" help="ISO 3166-1 alpha-2 (e.g. AU, US, TH)"
'''
run = 'nu scripts/bootstrap.nu show country ${usage_iso}'

[tasks."data:tax-codes"]
description = "72 SMP-eligible product tax codes grouped by category"
run = 'nu scripts/bootstrap.nu show tax-codes'

[tasks."data:tax-coverage"]
description = "82 buyer countries Stripe handles tax for under SMP"
run = 'nu scripts/bootstrap.nu show tax-coverage'

[tasks."data:tax"]
description = "One buyer country's tax coverage — usage: mise run data:tax -- TH"
usage = '''
arg "<iso>" help="ISO 3166-1 alpha-2 (e.g. TH, DE, US)"
'''
run = 'nu scripts/bootstrap.nu show tax ${usage_iso}'

[tasks."data:launches"]
description = "Per (project × country × mode) market-entry tracker"
run = 'nu scripts/bootstrap.nu show launches'

[tasks."data:flow"]
description = "End-to-end setup + dev loop walkthrough"
run = 'nu scripts/bootstrap.nu show flow'

# =============================================================================
# test:* — sandbox HIL flows. Each emits real Stripe API calls in TEST mode.
# =============================================================================

[tasks."test:customer"]
description = "Create a Stripe test customer"
run = 'fnox exec -- nu scripts/bootstrap.nu test customer'

[tasks."test:checkout"]
description = "SMP-mode Checkout Session — prints URL (pay with 4242…). Usage: mise run test:checkout -- [lookup_key]"
usage = '''
arg "[lookup_key]" help="default: sports_coach_monthly_usd" default=""
'''
run = 'fnox exec -- nu scripts/bootstrap.nu test checkout "${usage_lookup_key}"'

[tasks."test:checkout-payments"]
description = "Stripe Payments mode session (we are MoR). Usage: mise run test:checkout-payments -- [lookup_key]"
usage = '''
arg "[lookup_key]" help="default: sports_coach_monthly_usd" default=""
'''
run = 'fnox exec -- nu scripts/bootstrap.nu test checkout-payments "${usage_lookup_key}"'

[tasks."test:checkout-thai"]
description = "Thai buyer flow (locale=th, address required)"
run = 'fnox exec -- nu scripts/bootstrap.nu test checkout-thai'

[tasks."test:rpc-checkout"]
description = "POST /v1/checkout smoke test (201 happy path + two 401 auth-wall probes)"
run = 'fnox exec -- nu scripts/bootstrap.nu test rpc-checkout'

# =============================================================================
# xs:* — event store operations
# =============================================================================

[tasks."xs:cat"]
description = "Cat the entire event stream (via UDS — http-nu hosts it)"
run = "xs cat .xs-store/sock"

[tasks."xs:last"]
description = "Last event for a topic — usage: mise run xs:last -- stripe.webhook.received"
run = "xs last .xs-store/sock"

[tasks."xs:append"]
description = "Append a test event — usage: mise run xs:append -- topic.name 'body'"
usage = '''
arg "<topic>" help="event topic, e.g. test.verify"
arg "[body]"  help="event body (JSON string or plain text); empty if omitted" default=""
'''
run = 'printf "%s" "${usage_body}" | xs append .xs-store/sock "${usage_topic}"'

[tasks."xs:tail"]
description = "Tail last 20 events via the inspection HTTP endpoint (curl + jq)"
run = 'curl -s "http://localhost:8787/events?limit=20" | jq -c ".[] | {topic, id, meta}"'

[tasks."xs:counts"]
description = "Group recent events by topic + count (CLI inspection)"
run = 'curl -s "http://localhost:8787/events?limit=200" | jq -r "group_by(.topic) | map({topic: .[0].topic, count: length}) | sort_by(-.count) | .[] | \"\(.count)  \(.topic)\""'

# =============================================================================
# dispatch:* — Phase 3 outbound consumer fan-out audit (ADR-10)
#   Pairs:  .attempted ↔ .delivered (success) | .failed → .retry → .dead-lettered (giving up)
# =============================================================================

[tasks."dispatch:logs"]
description = "Tail the dispatcher daemon (live console output)"
run = "pitchfork logs dispatcher"

[tasks."dispatch:attempted"]
description = "Recent stripe.dispatch.attempted frames"
run = 'curl -s "http://localhost:8787/events?topic=stripe.dispatch.attempted&limit=20" | jq -c ".[] | {id, meta}"'

[tasks."dispatch:delivered"]
description = "Recent stripe.dispatch.delivered frames (consumer 2xx)"
run = 'curl -s "http://localhost:8787/events?topic=stripe.dispatch.delivered&limit=20" | jq -c ".[] | {id, meta}"'

[tasks."dispatch:failed"]
description = "Recent stripe.dispatch.failed frames (one per failed attempt)"
run = 'curl -s "http://localhost:8787/events?topic=stripe.dispatch.failed&limit=20" | jq -c ".[] | {id, meta}"'

[tasks."dispatch:retry"]
description = "Recent stripe.dispatch.retry frames (scheduled re-attempts)"
run = 'curl -s "http://localhost:8787/events?topic=stripe.dispatch.retry&limit=20" | jq -c ".[] | {id, meta}"'

[tasks."dispatch:dead-lettered"]
description = "Recent stripe.dispatch.dead-lettered frames (gave up after MAX_ATTEMPTS)"
run = 'curl -s "http://localhost:8787/events?topic=stripe.dispatch.dead-lettered&limit=20" | jq -c ".[] | {id, meta}"'

# =============================================================================
# rpc:* — Inbound consumer-RPC audit (POST /v1/checkout) (ADR-11)
# =============================================================================

[tasks."rpc:intent"]
description = "Recent stripe.intent.session.create frames (authenticated requests)"
run = 'curl -s "http://localhost:8787/events?topic=stripe.intent.session.create&limit=20" | jq -c ".[] | {id, meta}"'

[tasks."rpc:created"]
description = "Recent stripe.api.session.created frames (Stripe returned a URL)"
run = 'curl -s "http://localhost:8787/events?topic=stripe.api.session.created&limit=20" | jq -c ".[] | {id, meta}"'

[tasks."rpc:failed"]
description = "Recent stripe.api.session.failed frames"
run = 'curl -s "http://localhost:8787/events?topic=stripe.api.session.failed&limit=20" | jq -c ".[] | {id, meta}"'

# =============================================================================
# open:* — Idempotent browser launchers. Each probes whether the thing it
# points at is already configured (keychain entry present, Stripe account
# activated, etc.) and SKIPS the browser open when nothing needs doing.
# =============================================================================

[tasks."open:stripe-keys"]
description = "Stripe Dashboard → API keys (opens only if SMP_STRIPE_SECRET_KEY missing)"
run = "nu scripts/open.nu stripe-keys"

[tasks."open:stripe-account"]
description = "Stripe Dashboard → Account settings (opens only if account not yet activated)"
run = "fnox exec -- nu scripts/open.nu stripe-account"

[tasks."open:stripe-onboard"]
description = "Stripe Dashboard → Activation onboarding (opens only if account not yet activated)"
run = "fnox exec -- nu scripts/open.nu stripe-onboard"

[tasks."open:stripe-connectrpc"]
description = "Stripe Dashboard → Managed Payments (opens only if account not yet activated)"
run = "fnox exec -- nu scripts/open.nu stripe-connectrpc"

[tasks."open:stripe-webhooks"]
description = "Stripe Dashboard → Webhooks (opens only if SMP_STRIPE_WEBHOOK_SECRET missing)"
run = "nu scripts/open.nu stripe-webhooks"

[tasks."open:stripe-payment-methods"]
description = "Stripe Dashboard → Payment Methods (opens only if no webhook endpoint registered)"
run = "fnox exec -- nu scripts/open.nu stripe-payment-methods"

[tasks."open:stripe-products"]
description = "Stripe Dashboard → Products (opens only if no project-scoped products exist)"
run = "fnox exec -- nu scripts/open.nu stripe-products"

[tasks."open:stripe-dashboard"]
description = "Stripe Dashboard (opens only if account not yet activated)"
run = "fnox exec -- nu scripts/open.nu stripe-dashboard"

[tasks."open:cf-tokens"]
description = "Cloudflare → API tokens (opens only if CLOUDFLARE_API_TOKEN missing)"
run = "nu scripts/open.nu cf-tokens"

[tasks."open:cf-account"]
description = "Cloudflare → Dashboard (opens only if CLOUDFLARE_ACCOUNT_ID missing)"
run = "nu scripts/open.nu cf-account"

# =============================================================================
# cf:* — ALTERNATIVE RUNTIME (Cloudflare Workers).
# Scaffold lives under alt-runtime/cloudflare/. Skip this whole section if
# you only want the primary http-nu+xs runtime.
# =============================================================================

[tasks."cf:cargo-check"]
description = "cargo check the Workers wasm32 build (alt runtime)"
dir = "service/worker"
run = "cargo check --target $WASM_TARGET"

[tasks."cf:cargo-build"]
description = "worker-build --release (alt runtime)"
dir = "service/worker"
run = "worker-build --release"

[tasks."cf:cargo-clean"]
description = "cargo clean + remove build/ (alt runtime)"
dir = "service/worker"
run = "cargo clean ; rm -rf build"

[tasks."cf:worker-dev"]
description = "wrangler dev locally (alt runtime)"
dir = "service/worker"
run = "fnox exec -- nu scripts/worker-dev.nu"

[tasks."cf:worker-deploy"]
description = "Deploy worker to Cloudflare (alt runtime)"
dir = "service/worker"
run = "fnox exec -- wrangler deploy"

[tasks."cf:worker-tail"]
description = "Tail live Cloudflare Worker logs (alt runtime)"
dir = "service/worker"
run = "fnox exec -- wrangler tail"

[tasks."cf:worker-secret-put"]
description = "Push STRIPE_* secrets from fnox keychain → wrangler secrets (alt runtime)"
dir = "service/worker"
run = '''
fnox exec -- nu -c '$env.STRIPE_SECRET_KEY     | wrangler secret put STRIPE_SECRET_KEY'
fnox exec -- nu -c '$env.STRIPE_WEBHOOK_SECRET | wrangler secret put STRIPE_WEBHOOK_SECRET'
'''

# =============================================================================
# sigma:* — opensigma READ / ANALYTICS side (https://github.com/choyiny/opensigma).
#
# opensigma mirrors the Stripe account into Cloudflare D1 (read-only analytics:
# query/dashboard/NL over your billing data — a free Stripe Sigma replacement).
# It is the READ half; the primary http-nu+xs runtime above is the WRITE half.
# They are independent Stripe subscribers — opensigma subscribes to Stripe
# DIRECTLY (own webhook endpoint + read-only rk_ key), NOT through smp's
# dispatcher. So no source edits are needed: we vendor pristine upstream into
# .src/opensigma (gitignored) and rebase via `sigma:src`.
#
#   Offline (no creds):  sigma:src → sigma:install → sigma:eval
#   Live (needs creds; Queues are FREE-tier since 2026-02-04, 10k ops/day):
#                        sigma:d1-create → sigma:secrets → sigma:db-migrate → sigma:deploy
# =============================================================================

[tasks."sigma:src"]
description = "git clone/update pristine opensigma into .src/opensigma (gitignored)"
run = '''
set -e
if [ -d "$SIGMA_SRC/.git" ]; then
  echo "updating $SIGMA_SRC"
  git -C "$SIGMA_SRC" fetch --depth 1 origin
  git -C "$SIGMA_SRC" reset --hard origin/HEAD
else
  echo "cloning $SIGMA_REPO -> $SIGMA_SRC"
  git clone --depth 1 "$SIGMA_REPO" "$SIGMA_SRC"
fi
git -C "$SIGMA_SRC" log --oneline -1
'''

[tasks."sigma:src-clean"]
description = "Remove the vendored .src/opensigma checkout"
run = "rm -rf $SIGMA_SRC && echo removed"

[tasks."sigma:install"]
description = "pnpm install inside .src/opensigma"
depends = ["sigma:src"]
dir = "{{ config_root }}/.src/opensigma"
run = "pnpm install"

[tasks."sigma:config"]
description = "Materialize wrangler.jsonc from upstream's CI template (dummy ids; for offline test)"
dir = "{{ config_root }}/.src/opensigma"
run = "cp wrangler.jsonc.ci wrangler.jsonc && echo 'wrote wrangler.jsonc (ci template — replace database_id before deploy)'"

[tasks."sigma:typecheck"]
description = "tsc --noEmit on opensigma"
depends = ["sigma:config"]
dir = "{{ config_root }}/.src/opensigma"
run = "pnpm typecheck"

[tasks."sigma:test"]
description = "Run opensigma's vitest suite (workers pool; no Stripe creds needed)"
depends = ["sigma:config"]
dir = "{{ config_root }}/.src/opensigma"
run = "pnpm test"

[tasks."sigma:eval"]
description = "Full OFFLINE evaluation: install + typecheck + test (no creds, no deploy)"
depends = ["sigma:install"]
dir = "{{ config_root }}/.src/opensigma"
run = '''
cp wrangler.jsonc.ci wrangler.jsonc
pnpm typecheck
pnpm test
'''

# --- LOCAL run: mirror the existing Stripe account into a LOCAL D1 via
#     wrangler dev (miniflare emulates D1 + Queues). No Workers Paid, no
#     deploy. Reuses stripe-connectrpc's own STRIPE_API_KEY + STRIPE_WEBHOOK_SECRET
#     keychain items (opensigma reads the exact same env var names).
#
#     Flow:  sigma:dev-vars → sigma:db-local → sigma:dev (bg) → sigma:backload → sigma:d1
#     PROVEN 2026-06-20: 19 resources mirrored (95 checkout_sessions, 64
#     prices, 34 charges, …) from acct_1QJrzxABkTiOs5on test mode.

[tasks."sigma:dev-vars"]
description = "Generate ephemeral .dev.vars from the keychain (wrangler dev reads it; gitignored)"
dir = "{{ config_root }}/.src/opensigma"
run = '''
fnox exec -- sh -c 'printf "STRIPE_API_KEY=%s\nSTRIPE_WEBHOOK_SECRET=%s\n" "$STRIPE_API_KEY" "$STRIPE_WEBHOOK_SECRET" > .dev.vars'
echo "wrote .dev.vars from keychain (gitignored)"
'''

[tasks."sigma:db-local"]
description = "Apply Drizzle migrations to the LOCAL miniflare D1"
depends = ["sigma:config"]
dir = "{{ config_root }}/.src/opensigma"
run = "pnpm db:migrate:local"

[tasks."sigma:dev"]
description = "wrangler dev locally (miniflare D1+Queues). Run sigma:dev-vars + sigma:db-local first."
depends = ["sigma:dev-vars"]
dir = "{{ config_root }}/.src/opensigma"
run = "pnpm dev"

[tasks."sigma:backload"]
description = "Trigger the cron/scheduled handler once → enqueue a full backload (sigma:dev must be running)"
run = 'curl -s "http://localhost:8787/cdn-cgi/handler/scheduled" -w "\n%{http_code}\n"'

[tasks."sigma:d1"]
description = "Query the LOCAL D1 — usage: mise run sigma:d1 -- \"SELECT count(*) FROM charges\""
usage = '''
arg "<sql>" help="SQL to run against the local stripe_sync database"
'''
dir = "{{ config_root }}/.src/opensigma"
run = 'wrangler d1 execute stripe_sync --local --command "${usage_sql}"'

# --- live deploy (needs creds; Queues are free-tier since 2026-02-04) ---

[tasks."sigma:dev-remote"]
description = "wrangler dev against REMOTE resources (needs real wrangler.jsonc + deployed D1/Queues)"
dir = "{{ config_root }}/.src/opensigma"
run = "fnox exec -- pnpm dev --remote"

[tasks."sigma:d1-create"]
description = "Create the D1 database + the two queues (one-time). Paste database_id into wrangler.jsonc."
dir = "{{ config_root }}/.src/opensigma"
run = '''
fnox exec -- wrangler d1 create stripe_sync
fnox exec -- wrangler queues create stripe-sync-backload
fnox exec -- wrangler queues create stripe-sync-dlq
'''

[tasks."sigma:secrets"]
description = "Push opensigma secrets (read-only rk_ key + webhook secret) from fnox → wrangler"
dir = "{{ config_root }}/.src/opensigma"
run = '''
fnox exec -- nu -c '$env.SIGMA_STRIPE_API_KEY      | wrangler secret put STRIPE_API_KEY'
fnox exec -- nu -c '$env.SIGMA_STRIPE_WEBHOOK_SECRET | wrangler secret put STRIPE_WEBHOOK_SECRET'
'''

[tasks."sigma:db-migrate"]
description = "Apply Drizzle migrations to the remote D1 database"
dir = "{{ config_root }}/.src/opensigma"
run = "fnox exec -- pnpm db:migrate"

[tasks."sigma:deploy"]
description = "wrangler deploy opensigma to Cloudflare Workers"
dir = "{{ config_root }}/.src/opensigma"
run = "fnox exec -- pnpm deploy"

[tasks."sigma:backload-reset"]
description = "Force a full historical re-backload on the next cron tick"
dir = "{{ config_root }}/.src/opensigma"
run = "fnox exec -- pnpm backload:reset"

# =============================================================================
# native:* — the SAME ConnectRPC service (service/crates/connectrpc) on a
# native tokio/hyper axum server. No Cloudflare, runs on a laptop or VPS.
# The cf:* group runs the identical service as a Worker. service/native/.
# =============================================================================

[tasks."native:check"]
description = "cargo check the native ConnectRPC server"
dir = "service"
run = "cargo check -p stripe-native"

[tasks."native:run"]
description = "Run the native ConnectRPC server (STRIPE_SECRET_KEY + RAUTHY_ISSUER/RAUTHY_JWKS_URL from fnox/env)"
dir = "service"
run = "fnox exec -- cargo run -p stripe-native"

[tasks."rauthy:verify"]
description = "Prove stripe works behind the Rauthy→Cedar guard locally (Docker + ../../vm-uncloud → real token → CheckoutService). `-- --down` to tear down."
dir = "service"
run = "fnox exec -- nu scripts/rauthy-verify.nu"

[tasks."catalog:verify"]
description = "Load remy-sport products INTO Stripe via CatalogService.UpsertProduct (typed, admin-gated, idempotent — replaces the stripe-cli seed_products). `-- --down` to tear down."
dir = "service"
run = "fnox exec -- nu scripts/catalog-verify.nu"

[tasks."native:build"]
description = "Release build of the native ConnectRPC server"
dir = "service"
run = "cargo build -p stripe-native --release"

[tasks."proto:gen"]
description = "Regenerate codegen from proto/stripe/v1/*.proto (Rust via cargo build.rs; TS via buf)"
dir = "service/crates/connectrpc"
run = "buf generate"

[tasks."proto:lint"]
description = "Lint the smp proto (buf)"
dir = "service/crates/connectrpc"
run = "buf lint"
