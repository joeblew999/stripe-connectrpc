[tools]
"aqua:jdx/pitchfork" = "latest"
"aqua:nushell/nushell" = "0.112.2"
"aqua:stripe/stripe-cli" = "1.42.0"

# Runtime stack — cablehead's tools, installed from GitHub releases:
#   xs       = event store (single daemon, append-only stream)
#   http-nu  = HTTP server dispatching to nushell handlers
# pitchfork supervises both as daemons (see pitchfork.toml).
"github:cablehead/xs" = "0.12.0"
"github:cablehead/http-nu" = "0.16.0"

[env]
# xs store path — append-only events live here. Gitignored.
XS_STORE = "{{ config_root }}/.xs-store"
# http-nu listen address.
HTTP_NU_ADDR = "127.0.0.1:8787"


# =============================================================================
# bootstrap — first-time setup
# =============================================================================

[tasks."mise:install"]
description = "Install all CLI tools declared in [tools]"
run = "mise install"

[tasks."onboard"]
description = "Interactive: collect Stripe creds, store in macOS keychain via fnox"
run = "nu scripts/onboard.nu"

[tasks."verify"]
description = "Check toolchain + keychain entries"
run = "nu scripts/verify.nu"


# =============================================================================
# dev:* — supervise the runtime daemons (xs + http-nu + stripe listen)
# config: pitchfork.toml
# =============================================================================

[tasks."dev:up"]
description = "Start xs + http-nu + stripe-listen (auto-restart on crash)"
run = "pitchfork start -l -f"

[tasks."dev:down"]
description = "Stop all daemons"
run = "pitchfork stop http listen"

[tasks."dev:status"]
description = "Show pitchfork daemon status"
run = "pitchfork list"

[tasks."dev:logs"]
description = "Tail logs from all daemons"
run = "pitchfork logs http listen"

[tasks."dev:tui"]
description = "Interactive pitchfork dashboard"
run = "pitchfork tui"

[tasks."dev:restart-http"]
description = "Restart http-nu daemon (after handler.nu edits)"
run = "pitchfork stop http ; pitchfork start http"

[tasks."dev:restart-listen"]
description = "Restart stripe-listen (after a new whsec_)"
run = "pitchfork stop listen ; pitchfork start listen"


# =============================================================================
# xs:* — event store operations
# =============================================================================

[tasks."xs:cat"]
description = "Cat the event stream (http-nu hosts it; we talk via UDS)"
run = "xs cat .xs-store/sock"

[tasks."xs:last"]
description = "Last event for a topic — usage: mise run xs:last -- stripe.webhook.received"
run = "xs last .xs-store/sock"

[tasks."xs:append"]
description = "Append a test event — usage: mise run xs:append -- topic.name 'body'"
run = "xs append .xs-store/sock"


# =============================================================================
# stripe:* — Stripe CLI passthroughs
# =============================================================================

[tasks."stripe:login"]
description = "Pair stripe-cli with your Stripe account (browser)"
run = "stripe login"

[tasks."stripe:listen"]
description = "Forward Stripe webhooks to local http-nu (used by pitchfork's 'listen' daemon)"
run = "fnox exec -- stripe listen --forward-to http://localhost:8787/v1/webhook"

[tasks."stripe:trigger-completed"]
description = "Trigger a test checkout.session.completed event"
run = "fnox exec -- stripe trigger checkout.session.completed"


# =============================================================================
# open:* — browser URL launchers
# =============================================================================

[tasks."open:stripe-keys"]
description = "Stripe Dashboard → API keys (TEST mode)"
run = "nu scripts/open.nu stripe-keys"

[tasks."open:stripe-account"]
description = "Stripe Dashboard → Account settings"
run = "nu scripts/open.nu stripe-account"

[tasks."open:stripe-onboard"]
description = "Stripe Dashboard → Activation onboarding"
run = "nu scripts/open.nu stripe-onboard"

[tasks."open:stripe-smp"]
description = "Stripe Dashboard → Managed Payments settings"
run = "nu scripts/open.nu stripe-smp"

[tasks."open:stripe-webhooks"]
description = "Stripe Dashboard → Webhooks (TEST mode)"
run = "nu scripts/open.nu stripe-webhooks"

[tasks."open:stripe-payment-methods"]
description = "Stripe Dashboard → Payment Methods"
run = "nu scripts/open.nu stripe-payment-methods"

[tasks."open:stripe-products"]
description = "Stripe Dashboard → Products"
run = "nu scripts/open.nu stripe-products"

[tasks."open:stripe-dashboard"]
description = "Stripe Dashboard (TEST mode home)"
run = "nu scripts/open.nu stripe-dashboard"


# =============================================================================
# show:* — read-only display (no side effects)
# =============================================================================

[tasks."show:account"]
description = "Stripe account info — mode, country, currency, capabilities"
run = "fnox exec -- nu scripts/bootstrap.nu account"

[tasks."show:status"]
description = "Stripe-side snapshot — webhook endpoints, products, prices, portal configs"
run = "fnox exec -- nu scripts/bootstrap.nu status"

[tasks."show:countries"]
description = "Seller countries grouped by region with SMP / Payments markers"
run = "nu scripts/bootstrap.nu countries"

[tasks."show:country"]
description = "Look up modes for one country — usage: mise run show:country -- AU"
run = "nu scripts/bootstrap.nu check-country"

[tasks."show:tax-codes"]
description = "SMP-eligible product tax codes (72) grouped by category"
run = "nu scripts/bootstrap.nu tax-codes"

[tasks."show:tax-coverage"]
description = "Buyer countries where Stripe handles tax under SMP (82)"
run = "nu scripts/bootstrap.nu tax-coverage"

[tasks."show:tax"]
description = "Tax coverage for one country — usage: mise run show:tax -- TH"
run = "nu scripts/bootstrap.nu check-tax"

[tasks."show:launches"]
description = "Tracked project × jurisdiction launches with stage"
run = "nu scripts/bootstrap.nu launches"

[tasks."show:projects"]
description = "Registered consumer projects under data/projects/"
run = "nu scripts/bootstrap.nu projects"

[tasks."show:payment-methods"]
description = "Stripe payment methods currently enabled on this account (live query)"
run = "fnox exec -- nu scripts/bootstrap.nu payment-methods"

[tasks."show:scan"]
description = "Row counts across all data/ groups"
run = "nu scripts/bootstrap.nu scan"

[tasks."show:flow"]
description = "Print the end-to-end smp flow"
run = "nu scripts/bootstrap.nu flow"


# =============================================================================
# apply:* — mutate Stripe state from JSONL (idempotent)
# =============================================================================

[tasks."apply:products"]
description = "Seed Stripe Products from every data/projects/<slug>/products.jsonl"
run = "fnox exec -- nu scripts/bootstrap.nu products"

[tasks."apply:prices"]
description = "Seed Stripe Prices from every data/projects/<slug>/prices.jsonl"
run = "fnox exec -- nu scripts/bootstrap.nu prices"

[tasks."apply:portal"]
description = "Configure default Customer Portal from data/config/portal-config.jsonl"
run = "fnox exec -- nu scripts/bootstrap.nu portal"

[tasks."apply:webhook"]
description = "Register Stripe webhook endpoint at SMP_SERVICE_URL/v1/webhook"
run = "fnox exec -- nu scripts/bootstrap.nu webhook"

[tasks."apply:payment-methods"]
description = "Reconcile data/config/payment-methods.jsonl → Stripe account"
run = "fnox exec -- nu scripts/bootstrap.nu sync-payment-methods"

[tasks."apply:all"]
description = "Full Stripe-side seed: products → prices → portal → webhook"
run = "fnox exec -- nu scripts/bootstrap.nu all"


# =============================================================================
# teardown:* — archive per-project Stripe state
# =============================================================================

[tasks."teardown:project"]
description = "Archive products + prices for ONE project — usage: mise run teardown:project -- <slug>"
run = "fnox exec -- nu scripts/bootstrap.nu teardown"


# =============================================================================
# data:* — sync data/reference/ against upstream Stripe docs
# =============================================================================

[tasks."data:check"]
description = "Fetch Stripe docs, diff vs data/reference/*.jsonl"
run = "nu scripts/data-refresh.nu check"

[tasks."data:refresh"]
description = "Apply upstream changes to data/reference/ (stub — manual edit after check)"
run = "nu scripts/data-refresh.nu apply"


# =============================================================================
# test:* — sandbox HIL flows
# =============================================================================

[tasks."test:customer"]
description = "Create a test customer in Stripe"
run = "fnox exec -- nu scripts/bootstrap.nu test-customer"

[tasks."test:checkout"]
description = "Create a Checkout Session (SMP mode) — open URL in browser to pay"
run = "fnox exec -- nu scripts/bootstrap.nu test-checkout"

[tasks."test:checkout-payments"]
description = "Create a Checkout Session (Stripe Payments — we are MoR)"
run = "fnox exec -- nu scripts/bootstrap.nu test-checkout-payments"

[tasks."test:checkout-thai"]
description = "Thai-buyer Checkout (locale=th, address required, SMP w/ Thai VAT)"
run = "fnox exec -- nu scripts/bootstrap.nu test-checkout-thai"
