[tools]
"aqua:jdx/pitchfork" = "latest"
"aqua:nushell/nushell" = "0.112.2"
"aqua:stripe/stripe-cli" = "1.42.0"

# Runtime stack — cablehead's tools, installed from GitHub releases:
#   xs       = event store (single daemon, append-only stream)
#   http-nu  = HTTP server dispatching to nushell handlers
# pitchfork supervises both as daemons (see pitchfork.toml).
"github:cablehead/xs" = "0.12.0"
"github:cablehead/http-nu" = "0.16.0"

# --- alternative-runtime tools (cf:* tasks only) ---
# These let you also deploy the stripe-smp service to Cloudflare Workers.
# Not used by the primary http-nu+xs runtime — safe to remove if you'll
# never run cf:*. Pinned because wrangler breaks on minor bumps.
"npm:wrangler" = "4.71.0"

[env]
# xs store path — append-only events live here. Gitignored.
XS_STORE = "{{ config_root }}/.xs-store"
# http-nu listen address.
HTTP_NU_ADDR = "127.0.0.1:8787"
# wasm32 target for the Cloudflare path (cf:cargo-* tasks only).
WASM_TARGET = "wasm32-unknown-unknown"

# =============================================================================
# bootstrap — first-time setup
# =============================================================================

[tasks."mise:install"]
description = "Install all CLI tools declared in [tools]"
run = "mise install"

[tasks."onboard"]
description = "Interactive: collect Stripe creds, store in macOS keychain via fnox"
run = "nu scripts/onboard.nu"

[tasks."verify"]
description = "Check toolchain + keychain entries"
run = "nu scripts/verify.nu"

[tasks."verify:all"]
description = "Run every non-interactive mise task and report PASS/FAIL/SKIP"
run = "nu scripts/verify.nu --all"

# =============================================================================
# dev:* — supervise the runtime daemons (http-nu+xs + stripe listen + dispatcher)
# config: pitchfork.toml
# =============================================================================

[tasks."dev:up"]
description = "Start http-nu+xs + stripe-listen + dispatcher + dispatch-retry (auto-restart on crash)"
run = "pitchfork start -l -f"

[tasks."dev:down"]
description = "Stop all daemons"
run = "pitchfork stop http listen dispatcher dispatch-retry"

[tasks."dev:status"]
description = "Show pitchfork daemon status"
run = "pitchfork list"

[tasks."dev:logs"]
description = "Tail logs from all daemons"
run = "pitchfork logs http listen dispatcher dispatch-retry"

[tasks."dev:tui"]
description = "Interactive pitchfork dashboard"
run = "pitchfork tui"

[tasks."dev:restart-http"]
description = "Restart http-nu daemon (after handler.nu / routes/*.nu edits)"
run = "pitchfork stop http ; pitchfork start http"

[tasks."dev:restart-listen"]
description = "Restart stripe-listen (after a new whsec_)"
run = "pitchfork stop listen ; pitchfork start listen"

[tasks."dev:restart-dispatcher"]
description = "Restart dispatcher (after dispatcher.nu / lib.nu / project consumer block edits)"
run = "pitchfork stop dispatcher ; pitchfork start dispatcher"

[tasks."dev:restart-dispatch-retry"]
description = "Restart dispatch-retry daemon (after dispatch-retry.nu / lib.nu edits)"
run = "pitchfork stop dispatch-retry ; pitchfork start dispatch-retry"

# =============================================================================
# xs:* — event store operations
# =============================================================================

[tasks."xs:cat"]
description = "Cat the event stream (via UDS — http-nu hosts it)"
run = "xs cat .xs-store/sock"

[tasks."xs:last"]
description = "Last event for a topic — usage: mise run xs:last -- stripe.webhook.received"
run = "xs last .xs-store/sock"

[tasks."xs:append"]
description = "Append a test event — usage: mise run xs:append -- topic.name 'body'"
usage = '''
arg "<topic>" help="event topic, e.g. test.verify"
arg "[body]" help="event body (JSON string or plain text); empty if omitted" default=""
'''
run = 'printf "%s" "${usage_body}" | xs append .xs-store/sock "${usage_topic}"'

[tasks."xs:tail"]
description = "Tail recent events via the inspection HTTP endpoint (curl + jq)"
run = 'curl -s "http://localhost:8787/events?limit=20" | jq -c ".[] | {topic, id, meta}"'

[tasks."xs:counts"]
description = "Group recent events by topic + count (CLI inspection)"
run = 'curl -s "http://localhost:8787/events?limit=200" | jq -r "group_by(.topic) | map({topic: .[0].topic, count: length}) | sort_by(-.count) | .[] | \"\(.count)  \(.topic)\""'

# =============================================================================
# dispatch:* — Phase 3 consumer fan-out inspection (ADR-10)
# =============================================================================

[tasks."dispatch:logs"]
description = "Tail the dispatcher daemon (live console output)"
run = "pitchfork logs dispatcher"

[tasks."dispatch:attempted"]
description = "Recent stripe.dispatch.attempted frames"
run = 'curl -s "http://localhost:8787/events?topic=stripe.dispatch.attempted&limit=20" | jq -c ".[] | {id, meta}"'

[tasks."dispatch:delivered"]
description = "Recent stripe.dispatch.delivered frames"
run = 'curl -s "http://localhost:8787/events?topic=stripe.dispatch.delivered&limit=20" | jq -c ".[] | {id, meta}"'

[tasks."dispatch:failed"]
description = "Recent stripe.dispatch.failed frames (one per failed attempt)"
run = 'curl -s "http://localhost:8787/events?topic=stripe.dispatch.failed&limit=20" | jq -c ".[] | {id, meta}"'

[tasks."dispatch:retry"]
description = "Recent stripe.dispatch.retry frames (scheduled re-attempts)"
run = 'curl -s "http://localhost:8787/events?topic=stripe.dispatch.retry&limit=20" | jq -c ".[] | {id, meta}"'

[tasks."dispatch:dead-lettered"]
description = "Recent stripe.dispatch.dead-lettered frames (gave up after MAX_ATTEMPTS)"
run = 'curl -s "http://localhost:8787/events?topic=stripe.dispatch.dead-lettered&limit=20" | jq -c ".[] | {id, meta}"'

# =============================================================================
# rpc:* — Consumer-RPC inspection (POST /v1/checkout audit trail)
# =============================================================================

[tasks."rpc:intent"]
description = "Recent stripe.intent.session.create frames (authenticated consumer requests)"
run = 'curl -s "http://localhost:8787/events?topic=stripe.intent.session.create&limit=20" | jq -c ".[] | {id, meta}"'

[tasks."rpc:created"]
description = "Recent stripe.api.session.created frames (Stripe returned a checkout URL)"
run = 'curl -s "http://localhost:8787/events?topic=stripe.api.session.created&limit=20" | jq -c ".[] | {id, meta}"'

[tasks."rpc:failed"]
description = "Recent stripe.api.session.failed frames"
run = 'curl -s "http://localhost:8787/events?topic=stripe.api.session.failed&limit=20" | jq -c ".[] | {id, meta}"'

# =============================================================================
# stripe:* — Stripe CLI passthroughs
# =============================================================================

[tasks."stripe:login"]
description = "Pair stripe-cli with your Stripe account (browser)"
run = "stripe login"

[tasks."stripe:listen"]
description = "Forward Stripe webhooks to local http-nu (used by pitchfork's 'listen' daemon)"
run = "fnox exec -- stripe listen --forward-to http://localhost:8787/v1/webhook"

[tasks."stripe:trigger-completed"]
description = "Trigger a test checkout.session.completed event"
run = "fnox exec -- stripe trigger checkout.session.completed"

# =============================================================================
# open:* — browser URL launchers
# Idempotent: each task probes whether the thing it points at is already
# configured (keychain entry present, Stripe account activated, products
# seeded, etc.) and skips the browser open when nothing needs doing.
# =============================================================================

[tasks."open:stripe-keys"]
description = "Stripe Dashboard → API keys (opens only if SMP_STRIPE_SECRET_KEY missing)"
run = "nu scripts/open.nu stripe-keys"

[tasks."open:stripe-account"]
description = "Stripe Dashboard → Account settings (opens only if account not yet activated)"
run = "fnox exec -- nu scripts/open.nu stripe-account"

[tasks."open:stripe-onboard"]
description = "Stripe Dashboard → Activation onboarding (opens only if account not yet activated)"
run = "fnox exec -- nu scripts/open.nu stripe-onboard"

[tasks."open:stripe-smp"]
description = "Stripe Dashboard → Managed Payments (opens only if account not yet activated)"
run = "fnox exec -- nu scripts/open.nu stripe-smp"

[tasks."open:stripe-webhooks"]
description = "Stripe Dashboard → Webhooks (opens only if SMP_STRIPE_WEBHOOK_SECRET missing)"
run = "nu scripts/open.nu stripe-webhooks"

[tasks."open:stripe-payment-methods"]
description = "Stripe Dashboard → Payment Methods (opens only if no webhook endpoint registered)"
run = "fnox exec -- nu scripts/open.nu stripe-payment-methods"

[tasks."open:stripe-products"]
description = "Stripe Dashboard → Products (opens only if no project-scoped products exist)"
run = "fnox exec -- nu scripts/open.nu stripe-products"

[tasks."open:stripe-dashboard"]
description = "Stripe Dashboard (opens only if account not yet activated)"
run = "fnox exec -- nu scripts/open.nu stripe-dashboard"

# =============================================================================
# Verb tasks — single task per verb; the subcommand is a positional arg.
# Examples:
#   mise run show -- projects
#   mise run show -- country AU
#   mise run apply -- products
#   mise run test -- checkout sports_coach_monthly_usd
#   mise run teardown -- demo-app
# =============================================================================

[tasks.show]
description = "Read-only display — usage: mise run show -- <what> [arg]"
usage = '''
arg "<what>" help="account | status | countries | country | tax-codes | tax-coverage | tax | launches | projects | payment-methods | scan | flow"
arg "[arg]" help="optional arg (e.g. ISO code for country/tax)" default=""
'''
run = 'fnox exec -- nu scripts/bootstrap.nu show ${usage_what} "${usage_arg}"'

[tasks.apply]
description = "Apply intent to Stripe (idempotent) — usage: mise run apply -- <what>"
usage = '''
arg "<what>" help="products | prices | portal | webhook | payment-methods | all"
'''
run = 'fnox exec -- nu scripts/bootstrap.nu apply ${usage_what}'

[tasks.test]
description = "Sandbox HIL flows — usage: mise run test -- <flow> [arg]"
usage = '''
arg "<flow>" help="customer | checkout | checkout-payments | checkout-thai | rpc-checkout"
arg "[arg]" help="optional lookup_key for checkout flows" default=""
'''
run = 'fnox exec -- nu scripts/bootstrap.nu test ${usage_flow} "${usage_arg}"'

[tasks.teardown]
description = "Archive a project's products + prices — usage: mise run teardown -- <slug>"
usage = '''
arg "<slug>" help="project slug (must match data/projects/<slug>/)"
'''
run = 'fnox exec -- nu scripts/bootstrap.nu teardown ${usage_slug}'

# =============================================================================
# cf:* — ALTERNATIVE RUNTIME (Cloudflare Workers).
# Scaffold lives under alt-runtime/cloudflare/. Skip this whole section if
# you only want the primary http-nu+xs runtime.
# =============================================================================

[tasks."cf:cargo-check"]
description = "cargo check the Workers wasm32 build (alt runtime)"
dir = "alt-runtime/cloudflare"
run = "cargo check --target $WASM_TARGET"

[tasks."cf:cargo-build"]
description = "worker-build --release (alt runtime)"
dir = "alt-runtime/cloudflare"
run = "worker-build --release"

[tasks."cf:cargo-clean"]
description = "cargo clean + remove build/ (alt runtime)"
dir = "alt-runtime/cloudflare"
run = "cargo clean ; rm -rf build"

[tasks."cf:worker-dev"]
description = "wrangler dev locally (alt runtime)"
dir = "alt-runtime/cloudflare"
run = "fnox exec -- nu scripts/worker-dev.nu"

[tasks."cf:worker-deploy"]
description = "Deploy worker to Cloudflare (alt runtime)"
dir = "alt-runtime/cloudflare"
run = "fnox exec -- wrangler deploy"

[tasks."cf:worker-tail"]
description = "Tail live Cloudflare Worker logs (alt runtime)"
dir = "alt-runtime/cloudflare"
run = "fnox exec -- wrangler tail"

[tasks."cf:worker-secret-put"]
description = "Push STRIPE_* secrets from fnox keychain → wrangler secrets (alt runtime)"
dir = "alt-runtime/cloudflare"
run = '''
fnox exec -- nu -c '$env.STRIPE_SECRET_KEY     | wrangler secret put STRIPE_SECRET_KEY'
fnox exec -- nu -c '$env.STRIPE_WEBHOOK_SECRET | wrangler secret put STRIPE_WEBHOOK_SECRET'
'''

[tasks."open:cf-tokens"]
description = "Cloudflare → API tokens (opens only if CLOUDFLARE_API_TOKEN missing)"
run = "nu scripts/open.nu cf-tokens"

[tasks."open:cf-account"]
description = "Cloudflare → Dashboard (opens only if CLOUDFLARE_ACCOUNT_ID missing)"
run = "nu scripts/open.nu cf-account"
