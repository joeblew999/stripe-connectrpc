# Per-repo fnox config for smp — Stripe Managed Payments shared service
# on http-nu + xs (no Cloudflare).
#
# Naming convention: per-repo secrets prefixed SMP_* in the macOS keychain
# to avoid collisions with other repos, exported under their canonical env
# var names so stripe-cli and our scripts pick them up natively.
#
# `mise run onboard` walks a fresh clone through populating these.

[providers.keychain]
type = "keychain"
service = "fnox"

[secrets]
# Stripe API secret key (sk_test_... in dev, sk_live_... in prod).
# Exported under TWO env var names — same keychain item, two consumers:
#   STRIPE_SECRET_KEY → handlers calling Stripe directly.
#   STRIPE_API_KEY    → `stripe-cli` (the env var name it expects).
STRIPE_SECRET_KEY = { provider = "keychain", value = "SMP_STRIPE_SECRET_KEY" }
STRIPE_API_KEY    = { provider = "keychain", value = "SMP_STRIPE_SECRET_KEY" }

# Stripe webhook signing secret (whsec_...).
# Local dev: `mise run dev:up` starts stripe listen which prints one on first
# run; capture into the keychain. Prod: Stripe Dashboard → Developers →
# Webhooks → endpoint → Signing secret.
STRIPE_WEBHOOK_SECRET    = { provider = "keychain", value = "SMP_STRIPE_WEBHOOK_SECRET" }
SMP_STRIPE_WEBHOOK_SECRET = { provider = "keychain", value = "SMP_STRIPE_WEBHOOK_SECRET" }

# Deployed http-nu base URL — used by `apply -- webhook` to register the
# Stripe webhook endpoint pointing at the service. For local dev this is
# the stripe-listen tunnel; for prod, set to the public https URL.
SMP_SERVICE_URL = { provider = "keychain", value = "SMP_SERVICE_URL" }

# ─── Cloudflare path (alternative runtime, retained for later) ────────────
# Not used by the current http-nu + xs runtime, but kept so the Workers
# scaffold under src/ + wrangler.toml stays operational if we want to
# deploy the Worker variant as a CDN-edge front for the same data layer.
CLOUDFLARE_API_TOKEN  = { provider = "keychain", value = "CLOUDFLARE_API_TOKEN" }
CLOUDFLARE_ACCOUNT_ID = { provider = "keychain", value = "CLOUDFLARE_ACCOUNT_ID" }
SMP_WORKER_URL        = { provider = "keychain", value = "SMP_WORKER_URL" }
SMP_STRIPE_SECRET_KEY= { provider = "keychain", value = "SMP_STRIPE_SECRET_KEY" }
