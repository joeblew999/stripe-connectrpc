# Pitchfork supervises the two long-running dev processes so they stay
# alive across coding sessions, edits, and network blips (stripe listen
# occasionally drops its session on DNS hiccups — auto-restart fixes it).
#
# Start them all:   mise run dev:up
# Watch logs:       mise run dev:logs
# Stop them all:    mise run dev:down
# TUI dashboard:    mise run dev:tui
# Status snapshot:  mise run dev:status

[daemons.worker]
run = "mise run worker:dev"
auto_restart = true
# Wrangler prints "Ready on http://localhost:8787" once the wasm build
# finishes and the local Worker is bound. `start` waits for that line.
output = "Ready on"

[daemons.listen]
run = "mise run stripe:listen"
auto_restart = true
# stripe-cli prints "Ready! Your webhook signing secret is whsec_…" once
# the upstream session is established and forwarding is wired.
output = "Ready! Your webhook signing secret"
