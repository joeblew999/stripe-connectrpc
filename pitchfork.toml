# Pitchfork supervises the three runtime daemons.
#
# Start them all:   mise run dev:up
# Watch logs:       mise run dev:logs
# Stop them all:    mise run dev:down
# TUI dashboard:    mise run dev:tui

[daemons.http]
# http-nu IS the HTTP server AND the event store. The --store flag makes it
# embed cross.stream; handler.nu uses .cat / .append / .last natively. The
# --services flag exposes the store via UDS at .xs-store/sock so external
# `xs` CLI invocations (mise run xs:cat etc) AND the dispatcher daemon can
# read/write the same store.
#
# fnox exec wraps the daemon so STRIPE_WEBHOOK_SECRET (and friends) are in
# scope for the handler — needed for HMAC verification of inbound webhooks.
run = "fnox exec -- http-nu --store .xs-store --services --watch 127.0.0.1:8787 scripts/handler.nu"
auto_restart = true
output = "Listening on"

[daemons.listen]
# Stripe webhook tunnel — forwards stripe.com → localhost:8787/v1/webhook.
# Logs the whsec_ on first run; copy into the keychain.
run = "fnox exec -- stripe listen --forward-to http://localhost:8787/v1/webhook"
auto_restart = true
output = "Ready! Your webhook signing secret"

[daemons.dispatcher]
# Phase 3 consumer fan-out (ADR-10). Tails xs for stripe.webhook.verified
# and POSTs HMAC-signed events to each consumer's webhook_url. On 5xx /
# timeout / refused, emits a stripe.dispatch.retry frame that
# `dispatch-retry` (below) will re-attempt on a Stripe-style backoff.
run = "fnox exec -- nu scripts/handlers/dispatcher.nu"
auto_restart = true

[daemons.dispatch-retry]
# Polls xs every 15s for due stripe.dispatch.retry frames and re-dispatches
# via the same shared helper. After 7 total attempts (last at +24h), emits
# stripe.dispatch.dead-lettered and gives up. xs IS the queue.
run = "fnox exec -- nu scripts/handlers/dispatch-retry.nu"
auto_restart = true
