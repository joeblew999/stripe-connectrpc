syntax = "proto3";

// A slim, typed ConnectRPC facade over the async-stripe Cloudflare Workers
// transport — same pattern as joeblew999/google_maps feat/cloudflare-workers.
//
// It exposes ONLY what a consuming project needs, NOT Stripe's full ~534-op
// surface. Widen additively as projects need more (CreatePortalSession, etc.).
// smp's handler owns the scoping: it stamps metadata.project, picks the
// project's price by lookup_key, and never lets one project touch another's.
package stripe.v1;

service CheckoutService {
  // Create a Stripe Checkout Session for a project's price; returns the hosted URL.
  rpc CreateCheckoutSession(CreateCheckoutSessionRequest) returns (CreateCheckoutSessionResponse);
}

message CreateCheckoutSessionRequest {
  string project        = 1; // which project — scoping; smp stamps metadata.project
  string lookup_key     = 2; // selects the price, from the project's prices.jsonl
  string success_url    = 3;
  string cancel_url     = 4;
  string customer_email = 5; // optional
}

message CreateCheckoutSessionResponse {
  string session_id = 1; // cs_...
  string url        = 2; // hosted Stripe Checkout URL the project redirects the buyer to
}
